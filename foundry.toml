[profile.default]
src = "src"
test = "test"
libs = ["lib"]
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200
via_ir = true
evm_version = "shanghai"
remappings = [
  "@openzeppelin/=lib/openzeppelin-contracts/",
  "forge-std/=lib/forge-std/src/",
  "v3-core-08/=lib/v3-core-08/"
]
gas_reports = ["SentinelVault"]
# The policy parity table is read by both the Solidity kernel and the Python mirror, so the test suite
# needs read access to exactly that one folder (nothing else).
fs_permissions = [{ access = "read", path = "./test/fixtures" }]

[rpc_endpoints]
hsk = "https://mainnet.hsk.xyz"
hsk_testnet = "https://testnet.hsk.xyz"

[fmt]
line_length = 110
